# Testele automate ruleaza pe GitHub la fiecare push si pull request (tab-ul "Actions" din repository).
# 1. backend: testele JUnit/MockMvc pe un PostgreSQL adevarat
# 2. frontend: teste unitare Vitest pentru logica interfetei (in paralel cu backend)
# 3. e2e: aplicatia pornita complet + teste Playwright in browser (dupa ce trec testele backend)
# Procentele de acoperire a codului apar in sumarul fiecarei rulari (JaCoCo si Vitest).
name: Teste

on:
  push:
    branches: [main]
  pull_request:

env:
  # Doar pentru teste; secretul real de pe Render nu apare nicaieri in cod
  JWT_SECRET: secret-de-test-pentru-github-actions-minim-32-caractere

jobs:
  backend:
    name: Teste backend (JUnit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auction_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d auction_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Teste
        run: chmod +x mvnw && ./mvnw -B test -Pcoverage
      # Line coverage from the JaCoCo report, shown in the run summary on GitHub
      - name: Acoperire cod (JaCoCo)
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 } END {
            printf "### Acoperire backend (JaCoCo)\n\n%.1f%% din linii (%d din %d)\n", 100 * covered / (missed + covered), covered, missed + covered
          }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Raport acoperire backend
        uses: actions/upload-artifact@v4
        with:
          name: acoperire-backend
          path: target/site/jacoco/
      - name: Rapoarte teste (la esec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapoarte-junit
          path: target/surefire-reports/

  frontend:
    name: Teste interfata (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Teste unitare cu acoperire
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
      - name: Acoperire cod (Vitest)
        working-directory: frontend
        run: |
          node -e "const t = require('./coverage/coverage-summary.json').total;
            console.log('### Acoperire interfata (Vitest)\n\n' + t.lines.pct + '% din linii (' + t.lines.covered + ' din ' + t.lines.total + ')')" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Teste in browser (Playwright)
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auction_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d auction_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Porneste backend-ul
        run: |
          chmod +x mvnw && ./mvnw -B -q package -DskipTests
          nohup java -jar target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/stats && exit 0; sleep 2; done
          cat backend.log; exit 1
      - name: Instaleaza interfata si browserul
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build interfata
        working-directory: frontend
        run: npm run build
      - name: Teste Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Raport Playwright (la esec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
