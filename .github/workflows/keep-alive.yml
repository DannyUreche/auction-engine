# Keeps the free Render instance awake: Render stops it after 15 minutes without traffic and the
# next visitor then waits ~1 minute. This pings the health check every 10 minutes.
# (GitHub may delay scheduled runs a little and pauses them after 60 days without repository activity.)
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live site
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://auction-engine.onrender.com/api/health; then
              exit 0
            fi
            sleep 20
          done
          echo "The site did not answer" >&2
          exit 1
