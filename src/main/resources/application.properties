# Conexiunea la PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/auction_db
spring.datasource.username=admin
spring.datasource.password=password

# Setari JPA/Hibernate (dezactivam generarea automata a tabelelor in favoarea Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Setari Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Setari JWT
# Secretul NU se tine aici: vine din local.properties (ignorat de git) sau din variabila de mediu JWT_SECRET
spring.config.import=optional:file:./local.properties
# Durata de valabilitate a token-ului: 24 de ore
jwt.expiration-ms=86400000

# Imagini pentru obiecte
# Folderul in care se salveaza imaginile (relativ la folderul din care porneste aplicatia; ignorat de git)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB