# Portul serverului: pe hosting (ex: Render) vine din variabila PORT, local ramane 8080
server.port=${PORT:8080}

# Conexiunea la PostgreSQL
# Pe hosting valorile vin din variabilele de mediu DB_*; local se folosesc valorile de dupa ":" (containerul Docker)
# Baza de date: pe Render vine din DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD (Neon);
# local se folosesc valorile implicite (containerul Docker de pe portul 5433)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auction_db}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:admin}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:password}}

# Setari JPA/Hibernate (dezactivam generarea automata a tabelelor in favoarea Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Setari Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Setari JWT
# Secretul NU se tine aici: vine din local.properties (ignorat de git) sau din variabila de mediu JWT_SECRET
spring.config.import=optional:file:./local.properties
# Durata de valabilitate a token-ului: 24 de ore
jwt.expiration-ms=86400000

# Administratori: username-uri separate prin virgula (ex: danny,maria).
# Pe server vin din variabila ADMIN_USERNAMES; local se pot pune in local.properties
app.admin-usernames=${ADMIN_USERNAMES:}

# Imagini pentru obiecte (salvate in baza de date, tabela item_images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB