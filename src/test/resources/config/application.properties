# Doar pentru teste (se adauga peste src/main/resources/application.properties):
# testele fac multe login-uri rapid de pe aceeasi adresa, deci limita de cereri e ridicata.
# RateLimitApiTest isi seteaza propria limita mica.
app.rate-limit.auth-per-minute=1000

# Each test class with its own settings starts its own Spring context (cached, up to 32) with its own connection
# pool; small pools keep the total under PostgreSQL's 100 connections
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
