# Configurarea pentru Render (https://render.com) - "Blueprint".
# In Render: New + -> Blueprint -> alegi repository-ul -> Apply. Se creeaza serviciul web; baza de date e separat, pe Neon.

services:
  - type: web
    name: auction-engine
    runtime: docker
    plan: free
    region: frankfurt
    # Render verifica la aceasta adresa daca aplicatia a pornit
    healthCheckPath: /api/items/active
    envVars:
      # Baza de date este pe Neon (https://neon.tech, gratuita si nu expira).
      # Valorile se completeaza in Render -> auction-engine -> Environment, nu se tin in cod:
      #   DATABASE_URL      = jdbc:postgresql://<host-neon>/neondb?sslmode=require
      #   DATABASE_USERNAME = utilizatorul din Neon (ex: neondb_owner)
      #   DATABASE_PASSWORD = parola din Neon
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Emailuri (optional): datele SMTP de la Brevo (https://www.brevo.com), completate in Render -> Environment.
      # Fara ele, aplicatia merge normal, doar ca nu trimite emailuri.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_BASE_URL
        value: https://auction-engine.onrender.com
      # Secret JWT generat aleator de Render (nu apare nicaieri in cod)
      - key: JWT_SECRET
        generateValue: true
      # Administratorii (username-uri separate prin virgula). Valoarea se completeaza
      # in Render -> auction-engine -> Environment, nu se tine in cod.
      - key: ADMIN_USERNAMES
        sync: false
      # Optional "Sign in with Google": OAuth client id from Google Cloud Console (empty = button hidden)
      - key: GOOGLE_CLIENT_ID
        sync: false
